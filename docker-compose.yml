services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./portal/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./portal
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      # the address at which people reach this portal; stamped into sign-in tokens and
      # discovery documents, so it must be the public one when deployed
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-2026}
      SCHEME_DEADLINE: ${SCHEME_DEADLINE:-2026-12-31 23:59}
      AGENT_ENABLED_BLOCKS: ${AGENT_ENABLED_BLOCKS:-Sonari,Rajapara,Dhemaji Pathar,Borgaon,Namti,Khelua}
    depends_on:
      - db
      - smsgw
    volumes:
      - ./portal:/app
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: ./portal
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

  mcp-citizen:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: ["python", "-m", "uvicorn", "mcp_citizen.server:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PORTAL_INTERNAL_URL: http://app:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CITIZEN_RESOURCE_URL: http://localhost:8001/mcp/citizen
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-2026}
    depends_on:
      - app
    ports:
      - "8001:8001"

  mcp-officer:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: ["python", "-m", "uvicorn", "mcp_officer.server:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      PORTAL_INTERNAL_URL: http://app:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      OFFICER_RESOURCE_URL: http://localhost:8002/mcp/officer
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-2026}
    depends_on:
      - app
    ports:
      - "8002:8002"

volumes:
  pgdata:
  uploads:
  applogs:
